name: Hide Item
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date of the JSON file (YYYY-MM-DD)'
        required: true
      item_id:
        description: 'Item ID to remove'
        required: true

concurrency:
  group: hide-items
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove item from JSON
        run: |
          FILE="data/${{ github.event.inputs.date }}.json"
          if [ -f "$FILE" ]; then
            jq '.items |= map(select(.id != ($id | tonumber)))' \
              --arg id "${{ github.event.inputs.item_id }}" \
              "$FILE" > tmp.json && mv tmp.json "$FILE"
            jq '.items |= [to_entries[] | .value.id = (.key + 1) | .value]' \
              "$FILE" > tmp.json && mv tmp.json "$FILE"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Hide item ${{ github.event.inputs.item_id }} from ${{ github.event.inputs.date }}"
          for i in 1 2 3; do
            git push && break
            echo "Push failed, pulling and retrying ($i/3)..."
            git pull --rebase
            if [ $i -eq 3 ]; then
              echo "Failed after 3 retries"
              exit 1
            fi
          done
