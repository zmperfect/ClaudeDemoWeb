name: Hide Item
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date of the JSON file (YYYY-MM-DD)'
        required: true
      item_id:
        description: 'Item ID to remove'
        required: true

concurrency:
  group: hide-items
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove item and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILE="data/${{ github.event.inputs.date }}.json"
          ID="${{ github.event.inputs.item_id }}"

          for i in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master

            if [ ! -f "$FILE" ]; then
              echo "File $FILE not found, skipping"
              exit 0
            fi

            jq '.items |= map(select(.id != ($id | tonumber)))' \
              --arg id "$ID" "$FILE" > tmp.json && mv tmp.json "$FILE"
            jq '.items |= [to_entries[] | .value.id = (.key + 1) | .value]' \
              "$FILE" > tmp.json && mv tmp.json "$FILE"

            git add -A
            if git diff --staged --quiet; then
              echo "Item already removed, nothing to do"
              exit 0
            fi

            git commit -m "Hide item $ID from ${{ github.event.inputs.date }}"
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi

            echo "Push failed on attempt $i, retrying..."
            sleep 2
          done

          echo "Failed after 5 attempts"
          exit 1
